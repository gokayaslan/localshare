name: Windows uygulamasını derle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web dosyalarını ve ikonu kopyala
        shell: bash
        run: |
          mkdir -p desktop/web desktop/build
          cp index.html app.js style.css sw.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png desktop/web/
          cp icon-512.png desktop/build/icon.png

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Bağımlılıkları kur
        working-directory: desktop
        run: npm install

      - name: Kurulum dosyasını (.exe) derle
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Derlemeyi indirilebilir olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Windows
          path: desktop/dist/*.exe

      - name: Release sayfasına ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
